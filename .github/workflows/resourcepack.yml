name: Update and Release Resource Pack

on:
  workflow_dispatch: 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Download Resource Pack
        run: |
          curl -f -L -o resource_pack.zip https://github.com/huanhoahongso3-collab/myserver/raw/refs/heads/playit-only/polymer/resource_pack.zip
          if [ ! -s resource_pack.zip ]; then
            echo "Error: Downloaded file is empty"
            exit 1
          fi

      - name: Modify pack.mcmeta
        run: |
          # Use 7z to extract - it is much better at handling header mismatches
          7z x resource_pack.zip -o./temp_pack
          
          if [ ! -f temp_pack/pack.mcmeta ]; then
            echo "Error: pack.mcmeta not found"
            exit 1
          fi

          # Robust replacement for min_format
          sed -i 's/"min_format"[[:space:]]*:[[:space:]]*[0-9]*/"min_format": 46/g' temp_pack/pack.mcmeta
          
          # Delete old zip
          rm resource_pack.zip
          
          # Re-zip using 7z but specifically into a .zip format
          cd temp_pack
          7z a ../resource_pack.zip .
          cd ..

      - name: Generate Timestamp and Version
        id: vars
        run: |
          echo "version=v$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "full_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Resource Pack ${{ steps.vars.outputs.version }}
          body: |
            Uploaded on ${{ steps.vars.outputs.full_date }}
          files: resource_pack.zip
          draft: false
          prerelease: false
