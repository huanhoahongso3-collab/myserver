name: Update and Release Resource Pack

on:
  workflow_dispatch: 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Download Resource Pack
        run: |
          # Added -f to fail on 404/500 errors and -L to follow redirects
          curl -f -L -o resource_pack.zip https://github.com/huanhoahongso3-collab/myserver/raw/refs/heads/playit-only/polymer/resource_pack.zip
          
          # Verify the file exists and isn't empty
          if [ ! -s resource_pack.zip ]; then
            echo "Error: Downloaded file is empty or missing"
            exit 1
          fi

      - name: Modify pack.mcmeta
        run: |
          mkdir temp_pack
          unzip -q resource_pack.zip -d temp_pack
          
          # Check if pack.mcmeta actually exists
          if [ ! -f temp_pack/pack.mcmeta ]; then
            echo "Error: pack.mcmeta not found in the zip root"
            exit 1
          fi

          # Use a more robust sed to replace min_format
          # This handles spaces, tabs, and different line endings
          sed -i 's/"min_format"[[:space:]]*:[[:space:]]*[0-9]*/"min_format": 46/g' temp_pack/pack.mcmeta
          
          # Verify the change
          cat temp_pack/pack.mcmeta
          
          # Re-zip with the original name
          rm resource_pack.zip
          cd temp_pack
          zip -r ../resource_pack.zip .
          cd ..

      - name: Generate Timestamp and Version
        id: vars
        run: |
          echo "version=v$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "full_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Resource Pack ${{ steps.vars.outputs.version }}
          body: |
            Uploaded on ${{ steps.vars.outputs.full_date }}
          files: resource_pack.zip
          draft: false
          prerelease: false
